# DigiByte Core Railway Configuration (mainnet, full node)
#
# Used only by entrypoint-railway.sh, which appends the RPC credentials, bind
# address and allowed range from Railway variables. No secrets live in this file.
#
# Full node with transaction index, NOT pruned (spec FR-004). DigiByte Core v9.26.x
# keeps DigiDollar block history, and txindex is incompatible with pruning, so do
# not add a prune= line here.
server=1
daemon=0
printtoconsole=1
listen=1

# FR-014: the node holds no wallets. It serves public chain data and relays
# signed transactions only.
disablewallet=1

# Look up any historical transaction by id.
txindex=1

[main]
rpcport=14022
rpcthreads=4

# Memory tuning. entrypoint-railway.sh sets dbcache from DGB_DBCACHE_MB
# (raise it during the first sync, lower it afterwards).
maxmempool=100
maxconnections=40
