server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Response headers for every route; repeated inside each location that sets its own add_header (Nginx does not inherit then).
    include /etc/nginx/conf.d/security-headers.conf;

    # Blazor WASM content types
    include /etc/nginx/mime.types;
    types {
        application/wasm wasm;
        application/octet-stream dll;
        application/json blazorboot json;
    }

    # Enable gzip/brotli for WASM, DLL, and JS files
    gzip on;
    gzip_types application/wasm application/octet-stream application/javascript application/json text/css text/html;

    # Deployment settings written at container start (docker/web/40-write-config.sh). An exact-match location always wins over
    # the regular-expression rule below, so this file is never cached: a changed variable takes effect on the next page load.
    location = /config.json {
        default_type application/json;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/conf.d/security-headers.conf;
        try_files $uri =404;
    }

    # Fingerprinted framework files (the file name changes whenever the content does) can be cached for a year.
    # ^~ makes this win over the regular-expression rule below.
    location ^~ /_framework/ {
        gzip_static on;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/conf.d/security-headers.conf;
    }

    # Every other script, style and data file keeps its name across releases (js/crypto.js, js/crypto-worker.js, locales/*.json),
    # so it must be revalidated, not cached as immutable. js/crypto.js is tied to the C# that calls it: a stale copy next to a new
    # build would break unlock (specs/009-stronger-pin-protection). The ETag makes the revalidation cheap (304).
    # Serve pre-compressed .br and .gz files if available
    location ~* \.(dll|wasm|js|css|json)$ {
        gzip_static on;
        try_files $uri =404;
        add_header Cache-Control "no-cache";
        include /etc/nginx/conf.d/security-headers.conf;
    }

    # SPA fallback — all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Service worker must not be cached
    location = /service-worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/conf.d/security-headers.conf;
    }
    location = /service-worker-assets.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/conf.d/security-headers.conf;
    }
}
