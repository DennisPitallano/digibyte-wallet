# Security response headers for every route (specs/008-security-hardening, DGB-06).
# Nginx drops inherited add_header lines in any location that defines its own, so this snippet is included in the
# server block AND in each location that sets a header (see nginx.conf). A meta tag cannot set frame-ancestors or
# X-Frame-Options; these must be real response headers.
add_header Content-Security-Policy "frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
