name: build-sponsors-index

# Regenerates data/sponsors.json (the list the wallet reads) from the entry files after every push to this branch.
# The list is generated: never edit it by hand. The commit below is made by the GitHub Actions identity, which the branch ruleset
# allows to bypass the pull-request rule for exactly this file.
on:
  push:
    branches: [sponsors]
    paths:
      - "data/entries/**"
      - "data/donations/**"
      - "data/images/**"
      - "scripts/build_index.py"

permissions:
  contents: write

jobs:
  index:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate before publishing
        run: python scripts/validate.py .
      - name: Regenerate the list
        run: python scripts/build_index.py .
      - name: Commit if it changed
        run: |
          if git diff --quiet -- data/sponsors.json; then
            echo "No change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sponsors.json
          git commit -m "chore(sponsors): regenerate sponsors.json"
          git push
