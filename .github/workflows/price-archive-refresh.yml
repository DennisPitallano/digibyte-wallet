# Keeps the price service's daily archive current (spec 031, research R3, contracts/price-range-api.md "Archive refresh").
# Monthly: appends the days after each file's last date (never today) from the free live sources, and opens ONE pull request
# for review. It never merges anything. It fails when a file is still more than 300 days behind, so a neglected archive is
# noticed long before the 365-day live window stops covering the gap.
#
# Security-relevant: this workflow can push a branch and open a pull request (contents: write, pull-requests: write). It uses
# only the default GITHUB_TOKEN and no third-party actions beyond actions/checkout and actions/setup-dotnet.
name: price-archive-refresh
on:
  schedule:
    - cron: "17 3 2 * *"   # 03:17 UTC on the 2nd of every month
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: price-archive-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Append new days
        id: append
        run: |
          set +e
          dotnet run --project tools/PriceArchiveImport -- append-from-api src/DigiByte.Api/PriceArchive
          echo "status=$?" >> "$GITHUB_OUTPUT"

      - name: Open a pull request with the new days
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- src/DigiByte.Api/PriceArchive; then
            echo "No new days."
            exit 0
          fi
          branch="chore/price-archive-$(date -u +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add src/DigiByte.Api/PriceArchive
          git commit -m "chore(price-archive): add daily prices and rates up to $(date -u -d yesterday +%Y-%m-%d)"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "chore(price-archive): monthly daily price refresh" \
            --body "Appends the days after each archive file's last date, from CoinGecko (DGB prices), Frankfurter/ECB and exchange-api (USD rates). Generated by the price-archive-refresh workflow (spec 031). Review the added lines before merging; nothing here merges automatically."

      - name: Fail when the archive is too far behind
        if: steps.append.outputs.status != '0'
        run: |
          echo "A price archive file is more than 300 days behind, or the refresh failed. See the log above."
          exit 1
