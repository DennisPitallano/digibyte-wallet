name: Wallet release-hash manifest

# Triggered by pushing a tag like `wallet-v0.1.0`. Publishes the Blazor
# WebAssembly bundle, hashes every file in the published `wwwroot/`,
# and attaches both the manifest and a zipped copy of the bundle to the
# GitHub Release.
#
# This is the verifiable-build evidence WalletScrutiny reviewers (and
# anyone else) can use to confirm the JS / WASM their browser is loading
# from dgbwallet.app matches what this commit produces. See
# docs/walletscrutiny-self-eval.md §3.3 for the rationale.
on:
  push:
    tags:
      - 'wallet-v*'

jobs:
  publish-manifest:
    runs-on: ubuntu-latest
    permissions:
      # `contents: write` is required so softprops/action-gh-release can
      # create / update the GitHub Release. Read-only would be enough to
      # build but not to attach assets.
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          # Pinned via global.json — setup-dotnet honours it. The explicit
          # version below is a fallback in case the global.json file moves
          # or the action's version-file detection changes.
          dotnet-version: '10.0.x'
          global-json-file: global.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the stylesheet tools
        # The live container runs `npm install` before publishing (docker/web/Dockerfile), which
        # makes the publish rebuild tailwind.css. Do the same here, so this bundle is built the way
        # the site is and its tailwind.css is the rebuilt one, not the committed copy.
        run: npm ci
        working-directory: src/DigiByte.Web

      - name: Derive version from tag + verify csproj matches
        # github.ref_name is "wallet-v0.1.1"; strip the "wallet-v" prefix
        # so the assembly gets InformationalVersion=0.1.1 (what
        # AppVersion.cs surfaces in the UI footer).
        #
        # Then guard against drift: production redeploys are NOT this
        # workflow — they're a separate `dotnet publish` from main
        # without -p:Version=…, so they fall back to the csproj's
        # literal <Version>. If a maintainer cuts a tag without
        # bumping csproj, prod ends up showing the wrong version. Fail
        # loudly here so they don't find out from a screenshot.
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#wallet-v}"
          CSPROJ=$(grep -oP '(?<=<Version>)[^<]+' src/DigiByte.Web/DigiByte.Web.csproj | head -1)
          # CSPROJ may include a pre-release suffix (e.g. "0.1.3-beta.1")
          # while the tag is just "0.1.3" — match the leading SemVer.
          CSPROJ_BASE="${CSPROJ%%-*}"
          if [ "$VERSION" != "$CSPROJ_BASE" ]; then
            echo "::error::Tag version ($VERSION) doesn't match csproj <Version> ($CSPROJ). Bump src/DigiByte.Web/DigiByte.Web.csproj before tagging."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION (tag $GITHUB_REF_NAME, csproj $CSPROJ)"

      - name: Publish wallet (Release)
        run: |
          dotnet publish src/DigiByte.Web/DigiByte.Web.csproj \
            --configuration Release \
            --output publish \
            --nologo \
            -p:Version=${{ steps.version.outputs.version }} \
            -p:InformationalVersion=${{ steps.version.outputs.version }}

      - name: Verify the service worker's asset list
        # `dotnet publish` already rewrites index.html's CSP (CspHashInject.targets) and then
        # refreshes index.html's fingerprint in service-worker-assets.js. This step used to run
        # tools/inject-csp-hashes.py a second time, which changed index.html again and left the
        # fingerprint stale: the service worker checks every file against that list and refuses
        # to install if one does not match. Releases 0.7.0 and 0.8.0 shipped that way. Fail the release
        # here if any listed file does not match what was published.
        run: python tools/verify-sw-manifest.py publish/wwwroot

      - name: Generate manifest
        env:
          # GITHUB_REF_NAME is the tag itself (e.g. "wallet-v0.1.0") with
          # no refs/tags/ prefix to strip. GITHUB_SHA is the full commit.
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          python tools/generate-release-manifest.py \
            --asset-root publish/wwwroot \
            --tag "$TAG" \
            --commit "$COMMIT" \
            --output "release-hashes/${TAG}.json"

      - name: Zip published wallet
        # Bundle the published wwwroot/ so a reviewer can download exactly
        # what got deployed and hash it themselves against the manifest.
        # github.ref_name is already e.g. "wallet-v0.1.0" — don't re-prefix
        # or the asset ends up as "wallet-wallet-v0.1.0.zip".
        run: |
          cd publish
          zip -r "../${{ github.ref_name }}.zip" wwwroot
          cd ..

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-hashes/${{ github.ref_name }}.json
            ${{ github.ref_name }}.zip
          # Don't fail the job if the release already exists (idempotent
          # retries) — the action will update it.
          fail_on_unmatched_files: true
          generate_release_notes: true
