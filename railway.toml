# Railway configuration for DigiByte services
# This project deploys as SIX separate Railway services from this monorepo.
# See below for per-service setup instructions.
#
# ─── Node project (separate Railway project) ────────────────────────────────
#
# The full DigiByte Core node lives in its OWN Railway project with two services.
# Full steps, variables and runbook: docs/RAILWAY_NODE.md
#
#   digibyted  — docker/digibyted/Dockerfile, start command
#                /etc/digibyte/entrypoint-railway.sh, unpruned + txindex, 100 GB volume
#                at /root/.digibyte. NEVER give it a public domain or a TCP proxy for
#                the RPC port (14022). Variables: DGB_RPC_USER, DGB_RPC_PASSWORD,
#                DGB_RPC_ALLOW_IP (and optionally DGB_RPC_BIND, DGB_DBCACHE_MB).
#   node-api   — docker/node-api/Dockerfile, public domain, health check /api/health,
#                small volume for its DigiDollar index and metrics files. Reaches the
#                node over the private network (DIGIBYTE_HOST, DIGIBYTE_RPC_USER,
#                DIGIBYTE_RPC_PASSWORD). Needs NODEAPI_WRITE_KEY for operator-only routes.
#
# Service 4 below (pruned mainnet node) belongs to the existing project and is kept
# until the wallet has been cut over to the node project; it is then the rollback.
#
# ─── Main wallet stack ──────────────────────────────────────────────────────
#
# Service 1: digibyte-api
#   Dockerfile: docker/api/Dockerfile
#   Health check: /api/health
#   Env vars: ClientOrigin (comma-separated CORS origins)
#
# Service 2: digibyte-web
#   Dockerfile: docker/web/Dockerfile
#   Static Blazor WASM served by Nginx on port 8080
#   No env vars needed — config is in wwwroot/appsettings.json
#
# Service 3: digibyte-node-api
#   Dockerfile: docker/node-api/Dockerfile
#   Health check: /api/health
#
# Service 4: digibyted (mainnet pruned node)
#   Dockerfile: docker/digibyted/Dockerfile
#   Override entrypoint in Railway service settings:
#     /bin/bash /etc/digibyte/entrypoint-mainnet.sh
#   Required volume: mount to /root/.digibyte (50+ GB for initial sync, ~2 GB pruned)
#   Change RPC password in digibyte-mainnet.conf before deploying!
#
# ─── P2P light-client gateway (specs/011-p2p-spv-gateway) ────────────────────
#
# Service 7: digibyte-spv-gateway
#   Dockerfile: docker/spv-gateway/Dockerfile
#   Health check: /v1/health  (answers 200 for every state it can report on)
#   Needs no DigiByte node: it talks the peer protocol to public peers.
#   Volume: mount at /data. It holds the header chain, the block index for the scan window and the
#     peer book, so a restart resumes from stored state. Size: ESTIMATED at about 2 GB for the
#     default 90-day window (see docs/RAILWAY_NODE.md); measure on the first fill and adjust.
#   Env vars (all optional, defaults shown):
#     SpvGateway__Network=Mainnet            Mainnet | Testnet (testnet has no built-in checkpoint yet)
#     SpvGateway__DataDirectory=/data
#     SpvGateway__ScanWindowDays=90          how far back scans are answered directly
#     SpvGateway__MaxConcurrentScans=4       scans that run at once; more wait their turn
#     SpvGateway__RateLimitPerMinute=120     per client
#     SpvGateway__TrustForwardedFor=true     ONLY behind Railway's proxy, so the limit sees real clients
#   The wallet points at it with WALLET_GATEWAY_ENABLED=true and WALLET_GATEWAY_API_URL on digibyte-web.
#   The gateway sees the addresses a wallet asks about and nothing else; it never receives keys.
#
# ─── DigiPay stack ──────────────────────────────────────────────────────────
#
# Service 5: digipay-api
#   Dockerfile: docker/pay-api/Dockerfile
#   Health check: /api/health
#   Depends on a Railway Postgres addon in the same project.
#   Required env vars:
#     DigiPay__ConnectionString or DATABASE_URL — Postgres. Railway's addon
#         sets DATABASE_URL automatically; Program.cs normalises the
#         postgres:// URL into Npgsql key=value form.
#     DigiPay__DigiIdDomain  — public hostname the wallet signs against,
#         e.g. "pay.dgbwallet.app"
#     ClientWebUrl           — public URL of Pay.Web (used in checkoutUrl
#         responses), e.g. "https://pay.dgbwallet.app"
#     ClientOrigin           — comma-separated CORS origins. Minimum:
#         the Pay.Web public URL. Example:
#         "https://pay.dgbwallet.app,https://dgbwallet.app"
#     ASPNETCORE_ENVIRONMENT=Production  — Railway sets this by default; gates
#         off the /v1/pay/test/* demo endpoints.
#
# Service 6: digipay-web
#   Dockerfile: docker/pay-web/Dockerfile
#   Blazor SSR + InteractiveServer (needs the ASP.NET Core runtime, NOT
#   the static Nginx pattern the main wallet uses).
#   Health check: /
#   Required env vars:
#     DigiPay__ApiUrl        — internal URL of digipay-api, e.g. the
#         private Railway networking address:
#         "http://digipay-api.railway.internal:8080"
#         or the public one "https://api.pay.dgbwallet.app"
#     ASPNETCORE_ENVIRONMENT=Production
#
#   Custom domains: set pay.dgbwallet.app on digipay-web and
#   api.pay.dgbwallet.app on digipay-api (or keep the api internal).

[build]
# Default builder — each Railway service overrides the Dockerfile path
builder = "dockerfile"

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
